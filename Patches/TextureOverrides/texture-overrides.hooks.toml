# The old 8-bit and 4-bit bundle paths convert their source indices before
# reaching the common texture creator. These handlers remember the record
# identity and explicitly call the original function. The stolen instruction
# is a relative CALL, so it must not be replayed from the relocated wrapper.
[[hooks]]
address = 0x004CA1E8
type = "detour"
function = "CreateIndexed256WithMarker"
original_bytes = [0xE8, 0xB3, 0x3F, 0x04, 0x00]
skip_original_bytes = true
preserve_registers = true
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "[esp+0]"
type = "uint"
[[hooks.parameters]]
source = "[esp+4]"
type = "uint"
[[hooks.parameters]]
source = "[esp+8]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+12]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+16]"
type = "uint"
[[hooks.parameters]]
source = "[esp+20]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+24]"
type = "uint"
[[hooks.parameters]]
source = "[esp+28]"
type = "uint"

[[hooks]]
address = 0x004CA289
type = "detour"
function = "CreateIndexed16WithMarker"
original_bytes = [0xE8, 0xF2, 0x45, 0x04, 0x00]
skip_original_bytes = true
preserve_registers = true
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "[esp+0]"
type = "uint"
[[hooks.parameters]]
source = "[esp+4]"
type = "uint"
[[hooks.parameters]]
source = "[esp+8]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+12]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+16]"
type = "pointer"
[[hooks.parameters]]
source = "[esp+20]"
type = "uint"
[[hooks.parameters]]
source = "[esp+24]"
type = "uint"
[[hooks.parameters]]
source = "[esp+28]"
type = "uint"

# Every authored texture path converges on PCTex_CreateTexturePVRInId. These
# are all of its external call sites: indexed, standalone PVR, embedded PVR,
# renderer reload, and both LTI/BMP branches. Its internal tiling recursion is
# intentionally left untouched.

[metadata]
target_versions = [
    "0A11A49F3F63D4BB15650F322D654553FC47234B01885B852A058FF074689DEA",
    "D55A0BB0E920C497CE1CA76F08ED2E62FEEFCB6FF3C2901C0D59890F099BA93C"
